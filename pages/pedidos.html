<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos — Marsella Conecta</title>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#c65d3b">
<style>
  :root { --bg:#faf7f2; --surface:#fff; --ink:#2d2622; --ink-muted:#6b6560; --accent:#c65d3b; --accent2:#1b6b4a; --border:#e8e2db; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
  nav { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
  .logo { font-weight: 800; text-decoration: none; color: var(--ink); } .logo span { color: var(--accent); }
  .shell { max-width: 640px; margin: 0 auto; padding: 18px 16px 60px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; } .sub { color: var(--ink-muted); font-size: .9rem; margin-bottom: 16px; }
  .btn { border: none; border-radius: 12px; padding: 12px 16px; font: inherit; font-weight: 700; cursor: pointer; }
  .btn-ok { background: var(--accent2); color: #fff; } .btn-no { background: #fff; color: #b3261e; border: 1.5px solid #e6b8b4; }
  .btn-main { background: var(--accent); color: #fff; width: 100%; } .btn-ghost { background: #fff; border: 1.5px solid var(--border); color: var(--ink); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 2px 10px rgba(45,38,34,.06); }
  .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .muted { color: var(--ink-muted); font-size: .8rem; }
  .items { margin: 8px 0; font-size: .92rem; line-height: 1.6; }
  .actions { display: flex; gap: 10px; margin-top: 10px; } .actions .btn { flex: 1; }
  .pill { font-size: .72rem; font-weight: 800; padding: 3px 9px; border-radius: 12px; }
  .p-pendiente { background: #fff4e5; color: #9a5b00; } .p-aceptado { background: #e2f1ed; color: var(--accent2); } .p-modificado { background:#fff4e5; color:#9a5b00; } .p-cancelado { background:#fdecea; color:#b3261e; } .p-completado { background:#e8eaf6; color:#3949ab; } .p-rechazado { background: #fdecea; color: #b3261e; }
  .push-box { background: #fff; border: 1.5px dashed var(--accent2); border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; }
  input { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; font: inherit; margin-bottom: 10px; }
  .login { max-width: 380px; margin: 60px auto; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 26px; }
  .err { color: #b3261e; font-size: .85rem; margin-top: 8px; }
  h2 { font-size: 1rem; margin: 22px 0 10px; }
  select, textarea { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; font: inherit; margin-bottom: 10px; background: #fff; }
  .sla { font-size: .8rem; font-weight: 700; margin: 6px 0; } .sla.ok { color: var(--accent2); } .sla.late { color: #b3261e; }
  .btn-mod { background: #fff4e5; color: #9a5b00; border: 1.5px solid #f0c987; }
  .ov { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 800; display: none; align-items: flex-end; justify-content: center; } .ov.on { display: flex; }
  .sheet { background: #fff; width: 100%; max-width: 520px; border-radius: 20px 20px 0 0; padding: 18px 18px 26px; } @media (min-width: 641px) { .ov { align-items: center; } .sheet { border-radius: 20px; } }
</style>
</head>
<body>
<div id="loginScreen" class="login" style="display:none">
  <h1>📦 Pedidos</h1><p class="sub">Inicia sesión con la cuenta de tu negocio.</p>
  <input type="email" id="email" placeholder="Correo"><input type="password" id="password" placeholder="Contraseña">
  <button class="btn btn-main" onclick="doLogin()">Ingresar</button><div class="err" id="loginErr"></div>
</div>

<div id="app" style="display:none">
  <nav><a class="logo" href="../index.html">Marsella<span>Conecta</span></a><button class="btn btn-ghost" style="padding:8px 14px" onclick="doLogout()">Salir</button></nav>
  <div class="shell">
    <h1>📦 Pedidos de tus clientes</h1>
    <div class="sub" id="who">Cargando…</div>
    <div class="push-box" id="pushBox"></div>
    <div class="card" id="slaBox"></div>
    <div id="pending"></div>
    <div id="active"></div>
    <h2>Historial</h2>
    <div id="history"></div>
  </div>
</div>

<div class="ov" id="modOv" onclick="if(event.target===this)this.classList.remove('on')"><div class="sheet">
  <b style="font-size:1.05rem">✏️ Modificar el pedido</b>
  <div class="muted" style="margin:4px 0 12px">Baja la cantidad o pon 0 en lo que no tengas. El vecino verá el pedido actualizado y decidirá si lo acepta.</div>
  <div id="modItems" style="margin-bottom:10px"></div>
  <select id="modPreset"></select>
  <textarea id="modExtra" rows="2" maxlength="200" placeholder="Detalle adicional (opcional). No incluyas teléfonos."></textarea>
  <div class="actions"><button class="btn btn-ghost" onclick="document.getElementById('modOv').classList.remove('on')">Cancelar</button><button class="btn btn-main" style="width:auto" onclick="sendMod()">Enviar al vecino</button></div>
  <div class="err" id="modErr"></div>
</div></div>

<script type="module">
import { supabase } from '../assets/js/supabase.js';
import { pushState, enablePush, disablePush, relinkPush } from '../assets/js/push.js';
import { openOrderChat, unreadCount } from '../assets/js/chat.js';

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => '$' + Number(n || 0).toFixed(2);
const fmt = (d) => new Date(d).toLocaleString('es-SV', { timeZone: 'America/El_Salvador', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
let bizNames = {}, myBiz = [], modId = null, ordersById = {}, discarded = new Set();
const MODS = ['No tenemos disponible uno o más productos de tu pedido.', 'No tenemos toda la cantidad que pediste.', 'Podemos entregar solo una parte de tu pedido hoy.', 'Tu pedido tendrá un costo adicional de entrega.', 'Podemos entregarlo más tarde de lo normal.', 'Solo podemos entregarlo mañana.', 'Necesitamos confirmar el precio de algún producto.', 'Podemos ofrecerte un producto sustituto, ¿te parece bien?', 'Otro (escribe el detalle abajo)'];
const SLAS = [[5, '5 minutos'], [10, '10 minutos'], [15, '15 minutos'], [30, '30 minutos'], [60, '1 hora'], [120, '2 horas'], [240, '4 horas']];

async function boot() {
  const { data: { session } } = await supabase.auth.getSession();
  document.getElementById('loginScreen').style.display = session ? 'none' : 'block';
  document.getElementById('app').style.display = session ? 'block' : 'none';
  if (!session) return;
  await relinkPush();
  const { data: me } = await supabase.from('profiles').select('id,nombre').eq('auth_user_id', session.user.id).maybeSingle();
  const { data: mine } = me ? await supabase.from('businesses').select('id,nombre,response_minutes').eq('owner_profile_id', me.id) : { data: [] };
  myBiz = mine || [];
  (mine || []).forEach((b) => { bizNames[b.id] = b.nombre; });
  document.getElementById('who').textContent = (mine || []).length ? 'Negocio(s): ' + mine.map((b) => b.nombre).join(', ') : 'Tu cuenta aún no tiene un negocio asignado.';
  renderSla(); await renderPush(); await loadOrders();
  clearInterval(window._poll); window._poll = setInterval(loadOrders, 20000);
}

function renderSla() {
  const box = document.getElementById('slaBox');
  if (!myBiz.length) { box.style.display = 'none'; return; }
  box.innerHTML = '<b>⏱️ Tu tiempo de respuesta</b><div class="muted" style="margin:4px 0 10px">Los vecinos verán en cuánto tiempo respondes los pedidos. Se cuenta desde que llega la solicitud.</div>' +
    myBiz.map((b) => `<div class="muted" style="margin-top:6px"><b>${esc(b.nombre)}</b></div><select onchange="saveSla('${b.id}', this.value)">${SLAS.map(([m, l]) => `<option value="${m}" ${Number(b.response_minutes || 30) === m ? 'selected' : ''}>${l}</option>`).join('')}</select>`).join('');
}
window.saveSla = async (id, v) => {
  const { error } = await supabase.from('businesses').update({ response_minutes: Number(v) }).eq('id', id);
  if (error) alert('No se pudo guardar: ' + error.message); else { const b = myBiz.find((x) => x.id === id); if (b) b.response_minutes = Number(v); }
};
async function renderPush() {
  const st = await pushState(); const box = document.getElementById('pushBox');
  const T = {
    unsupported: '<b>Este navegador no admite notificaciones.</b><div class="muted">Usa Chrome en Android o instala la app en iPhone.</div>',
    'needs-install': '<b>En iPhone:</b> primero toca Compartir ⬆️ → “Añadir a pantalla de inicio”, abre la app y vuelve aquí para activar las notificaciones.',
    denied: '<b>Notificaciones bloqueadas.</b><div class="muted">Actívalas en los ajustes del navegador para este sitio.</div>',
    on: '<b>🔔 Notificaciones activas en este dispositivo.</b><div class="muted">Te avisaremos cuando llegue un pedido.</div><div class="actions"><button class="btn btn-ghost" onclick="togglePush()">Desactivar</button></div>',
    off: '<b>🔕 Activa las notificaciones</b><div class="muted">Para enterarte al instante cuando un vecino te haga un pedido.</div><div class="actions"><button class="btn btn-main" onclick="togglePush()">Activar notificaciones</button></div>'
  };
  box.innerHTML = T[st];
}
window.togglePush = async () => {
  try { (await pushState()) === 'on' ? await disablePush() : await enablePush(); }
  catch (e) { alert('No se pudo cambiar: ' + (e.message || e)); }
  renderPush();
};

function orderCard(o) {
  const items = (o.items || []).map((i) => `• ${esc(i.name)} ×${esc(i.qty)} — ${money((i.price || 0) * i.qty)}`).join('<br>');
  const left = o.due_at ? Math.round((new Date(o.due_at).getTime() - Date.now()) / 60000) : null;
  const sla = o.status === 'pendiente' && left !== null ? (left >= 0 ? `<div class="sla ok">⏱️ Responde antes de las ${new Date(o.due_at).toLocaleTimeString('es-SV', { timeZone: 'America/El_Salvador', hour: '2-digit', minute: '2-digit' })} (quedan ${left} min)</div>` : `<div class="sla late">⚠️ Vencido hace ${-left} min. Responde lo antes posible.</div>`) : '';
  const note = o.status === 'modificado' ? `<div class="sla" style="color:#9a5b00">✏️ Esperando respuesta del vecino: “${esc(o.business_note || '')}”${o.proposed_items ? '<br>Nuevo pedido: ' + o.proposed_items.map((i) => esc(i.name) + ' ×' + esc(i.qty)).join(', ') + ' — ' + money(o.proposed_total) : ''}</div>` : '';
  const acts = o.status === 'pendiente' ? `<div class="actions"><button class="btn btn-ok" onclick="respond('${o.id}','aceptado')">✅ Aceptar</button><button class="btn btn-mod" onclick="openMod('${o.id}')">✏️ Modificar</button><button class="btn btn-no" onclick="respond('${o.id}','rechazado')">✖ Rechazar</button></div>`
    : o.status === 'aceptado' ? `<div class="actions"><button class="btn btn-ok" onclick="completeOrder('${o.id}')">📦 Marcar como entregado</button></div>` : '';
  return `<div class="card"><div class="row"><b>${esc(o.customer_name || 'Vecino')}</b><span class="pill p-${o.status}">${o.status}</span></div>
    <div class="muted">${esc(bizNames[o.business_id] || '')} · ${fmt(o.created_at)}</div><div class="items">${items}</div>
    <div class="row"><b>Total ${money(o.total)}</b></div>${sla}${note}${acts}
    ${!['rechazado', 'cancelado'].includes(o.status) ? `<div class="actions"><button class="btn btn-ghost" onclick="openChat('${o.id}','${esc(o.customer_name || 'Vecino').replace(/'/g, '')}')">💬 Chat <span id="unr-${o.id}"></span></button></div>` : ''}</div>`;
}
async function loadOrders() {
  const { data, error } = await supabase.from('orders').select('*').order('created_at', { ascending: false }).limit(100);
  if (error) { document.getElementById('pending').innerHTML = '<div class="err">No se pudieron cargar los pedidos.</div>'; return; }
  ordersById = Object.fromEntries((data || []).map((o) => [o.id, o]));
  const pend = (data || []).filter((o) => o.status === 'pendiente'), active = (data || []).filter((o) => ['aceptado', 'modificado'].includes(o.status)), done = (data || []).filter((o) => ['rechazado', 'completado', 'cancelado'].includes(o.status));
  document.getElementById('pending').innerHTML = pend.length ? '<h2>⏳ Por responder (' + pend.length + ')</h2>' + pend.map(orderCard).join('') : '<div class="card muted">No tienes pedidos por responder.</div>';
  document.getElementById('active').innerHTML = active.length ? '<h2>🚚 En curso (' + active.length + ')</h2>' + active.map(orderCard).join('') : '';
  document.getElementById('history').innerHTML = done.length ? done.map(orderCard).join('') : '<div class="muted">Aún no hay historial.</div>';
  const { data: { session } } = await supabase.auth.getSession();
  for (const o of (data || []).filter((x) => x.status !== 'rechazado').slice(0, 20)) {
    unreadCount(o.id, session.user.id).then((n) => { const el = document.getElementById('unr-' + o.id); if (el && n) el.innerHTML = '<span class="pill p-pendiente">' + n + ' nuevo(s)</span>'; }).catch(() => {});
  }
  const want = new URLSearchParams(location.search).get('order');
  if (want && !window._chatOpened && (data || []).some((o) => o.id === want)) { window._chatOpened = true; const o = data.find((x) => x.id === want); openOrderChat(want, o.customer_name || 'Vecino'); }
}
window.openChat = (id, name) => openOrderChat(id, name);
window.modDiscard = (k) => {
  const o = ordersById[modId]; const inp = document.getElementById('mq' + k), row = document.getElementById('mrow' + k), btn = document.getElementById('mbtn' + k);
  if (discarded.has(k)) { discarded.delete(k); inp.disabled = false; inp.value = o.items[k].qty; row.style.opacity = 1; row.querySelector('.mname').style.textDecoration = 'none'; btn.textContent = '🗑 Descartar'; }
  else { discarded.add(k); inp.value = 0; inp.disabled = true; row.style.opacity = .55; row.querySelector('.mname').style.textDecoration = 'line-through'; btn.textContent = '↩ Restaurar'; }
  modCalc();
};
window.modCalc = () => {
  const o = ordersById[modId]; if (!o) return; let t = 0;
  (o.items || []).forEach((i, k) => { const v = Math.max(0, Math.min(Number(i.qty), Number(document.getElementById('mq' + k).value || 0))); t += (Number(i.price) || 0) * v; });
  document.getElementById('modTotal').textContent = 'Nuevo total: ' + money(t) + '  (antes ' + money(o.total) + ')';
};
window.openMod = (id) => {
  modId = id; discarded = new Set(); const o = ordersById[id] || { items: [] };
  document.getElementById('modItems').innerHTML = (o.items || []).map((i, k) => `<div class="row" id="mrow${k}" style="padding:8px 0;border-bottom:1px solid var(--border);align-items:center;gap:8px"><span style="flex:1"><span class="mname">${esc(i.name)}</span><br><span class="muted">pidió ${esc(i.qty)} · ${money(i.price)}</span></span><input id="mq${k}" type="number" min="0" max="${esc(i.qty)}" value="${esc(i.qty)}" oninput="modCalc()" style="width:64px;margin:0;padding:8px"><button class="btn btn-no" id="mbtn${k}" style="padding:8px 10px;font-size:.78rem" onclick="modDiscard(${k})">🗑 Descartar</button></div>`).join('')
    + '<div class="sla" id="modTotal" style="margin-top:8px"></div><div class="muted" id="modInv" style="margin-top:4px"></div><label class="muted" style="display:flex;gap:8px;align-items:flex-start;margin-top:6px"><input type="checkbox" id="modStock" checked style="width:auto;margin:2px 0 0"><span>Marcar los productos descartados como <b>agotados</b> (inventario en 0)</span></label>';
  const pids = (o.items || []).map((i) => i.product_id).filter(Boolean);
  if (pids.length) supabase.from('products').select('id,name,stock_qty').in('id', pids).then(({ data }) => { const t = (data || []).filter((x) => x.stock_qty != null).map((x) => esc(x.name) + ': ' + x.stock_qty + ' en inventario').join(' · '); document.getElementById('modInv').innerHTML = t ? '📦 ' + t : ''; });
  modCalc(); document.getElementById('modErr').textContent = ''; document.getElementById('modExtra').value = '';
  document.getElementById('modPreset').innerHTML = MODS.map((m) => `<option>${esc(m)}</option>`).join('');
  document.getElementById('modOv').classList.add('on');
};
window.sendMod = async () => {
  const preset = document.getElementById('modPreset').value, extra = document.getElementById('modExtra').value.trim();
  const note = preset.startsWith('Otro') ? extra : (preset + (extra ? ' ' + extra : ''));
  const o = ordersById[modId] || { items: [] };
  const items = (o.items || []).map((i, k) => ({ product_id: i.product_id, qty: Math.max(0, Math.min(Number(i.qty), Number(document.getElementById('mq' + k).value || 0))) }));
  const changed = items.some((x, k) => x.qty !== Number(o.items[k].qty));
  if (!changed && preset.startsWith('Otro') && !extra) { document.getElementById('modErr').textContent = 'Cambia una cantidad o escribe el detalle.'; return; }
  if (items.every((x) => x.qty === 0)) { document.getElementById('modErr').textContent = 'Si no puedes con nada del pedido, usa Rechazar.'; return; }
  const { error } = await supabase.rpc('modify_order', { p_order_id: modId, p_note: note, p_items: changed ? items : null });
  if (error) { document.getElementById('modErr').textContent = error.message; return; }
  document.getElementById('modOv').classList.remove('on');
  if (document.getElementById('modStock')?.checked) {
    const gone = (o.items || []).filter((i, k) => discarded.has(k) && i.product_id).map((i) => i.product_id);
    if (gone.length) { await supabase.from('products').update({ in_stock: false }).in('id', gone); await supabase.from('products').update({ stock_qty: 0 }).in('id', gone).not('stock_qty', 'is', null); }
  }
  supabase.functions.invoke('order-push', { body: { order_id: modId, event: 'modify' } }).catch(() => {});
  loadOrders();
};
window.completeOrder = async (id) => {
  if (!confirm('¿Marcar este pedido como entregado? Se cerrará el chat.')) return;
  const { error } = await supabase.rpc('complete_order', { p_order_id: id });
  if (error) { alert('No se pudo actualizar: ' + error.message); return; }
  loadOrders();
};
window.respond = async (id, status) => {
  if (!confirm(status === 'aceptado' ? '¿Aceptar este pedido?' : '¿Rechazar este pedido?')) return;
  const { error } = await supabase.rpc('respond_order', { p_order_id: id, p_status: status });
  if (error) { alert('No se pudo actualizar: ' + error.message); return; }
  supabase.functions.invoke('order-push', { body: { order_id: id, event: 'response' } }).catch(() => {});
  loadOrders();
};
window.doLogin = async () => {
  const { error } = await supabase.auth.signInWithPassword({ email: document.getElementById('email').value.trim(), password: document.getElementById('password').value });
  if (error) { document.getElementById('loginErr').textContent = 'Correo o contraseña incorrectos.'; return; }
  boot();
};
window.doLogout = async () => { await supabase.auth.signOut(); location.reload(); };
boot();
</script>
</body>
</html>
