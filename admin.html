<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marsella Conecta — Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="config.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: #f9fafb;
  color: #2d2622;
}

nav {
  background: #ffffff;
  border-bottom: 1px solid #e8e2db;
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 1px 2px rgba(45, 38, 34, 0.04);
}

.nav-logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.2rem;
  color: #c65d3b;
}

.nav-links a {
  color: #2d2622;
  text-decoration: none;
  margin-left: 24px;
  font-weight: 500;
}

.nav-links a:hover {
  color: #c65d3b;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 20px;
}

h1 {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 2rem;
  margin-bottom: 32px;
  color: #c65d3b;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  border-bottom: 2px solid #e8e2db;
  flex-wrap: wrap;
}

.tab-btn {
  padding: 12px 16px;
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  cursor: pointer;
  font-weight: 600;
  color: #6b6560;
  transition: all 0.2s;
}

.tab-btn.active {
  color: #c65d3b;
  border-bottom-color: #c65d3b;
}

.dashboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 24px;
  margin-bottom: 32px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 1px 3px rgba(45, 38, 34, 0.04);
  border: 1px solid #e8e2db;
  display: none;
}

.card.active {
  display: block;
}

.card.full-width {
  grid-column: 1 / -1;
}

.card h3 {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  margin-bottom: 16px;
  color: #2d2622;
}

.stat-item {
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid #f5f1eb;
}

.stat-item:last-child {
  border-bottom: none;
}

.stat-label {
  color: #6b6560;
  font-size: 0.9rem;
}

.stat-value {
  font-weight: 700;
  color: #c65d3b;
  font-size: 1rem;
}

.btn-expand {
  background: #c65d3b;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.85rem;
  margin-top: 12px;
  width: 100%;
  transition: opacity 0.2s;
}

.btn-expand:hover {
  opacity: 0.9;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal.active {
  display: flex;
}

.modal-content {
  background: white;
  border-radius: 12px;
  max-width: 600px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 24px;
  position: relative;
}

.modal-close {
  position: absolute;
  top: 12px;
  right: 12px;
  background: none;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  color: #6b6560;
}

.modal h2 {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  margin-bottom: 16px;
  color: #c65d3b;
}

.list-item {
  padding: 12px;
  border-bottom: 1px solid #e8e2db;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.list-item:last-child {
  border-bottom: none;
}

.list-rank {
  font-weight: 700;
  color: #c65d3b;
  min-width: 30px;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-weight: 600;
  margin-bottom: 6px;
}

.form-group input, .form-group textarea, .form-group select {
  width: 100%;
  padding: 8px;
  border: 1px solid #e8e2db;
  border-radius: 6px;
  font-family: 'DM Sans', sans-serif;
}

.form-group textarea {
  min-height: 80px;
  resize: vertical;
}

.btn {
  background: #c65d3b;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  width: 100%;
  margin-top: 12px;
}

.btn:hover {
  opacity: 0.9;
}

.featured-item {
  background: #faf7f2;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.featured-item .info {
  flex: 1;
}

.featured-item .actions {
  display: flex;
  gap: 8px;
}

.btn-sm {
  padding: 6px 12px;
  font-size: 0.85rem;
  background: #c65d3b;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

.btn-sm.danger {
  background: #dc3545;
}

.loading {
  text-align: center;
  padding: 32px;
  color: #6b6560;
}

.error {
  background: #ffebee;
  color: #c62828;
  padding: 16px;
  border-radius: 8px;
  margin-bottom: 16px;
}

.success {
  background: #e8f5e9;
  color: #1b6b4a;
  padding: 16px;
  border-radius: 8px;
  margin-bottom: 16px;
}

.login-form {
  max-width: 400px;
  margin: 60px auto;
  background: white;
  padding: 32px;
  border-radius: 12px;
  box-shadow: 0 4px 12px rgba(45, 38, 34, 0.08);
}

.login-form h2 {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  margin-bottom: 24px;
  color: #c65d3b;
}

.login-form .form-group {
  margin-bottom: 20px;
}

.login-form input {
  width: 100%;
  padding: 12px;
  border: 1px solid #e8e2db;
  border-radius: 8px;
}

.login-form .btn {
  margin-top: 16px;
  padding: 12px;
  font-weight: 600;
}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">🌶️ Marsella CONECTA — Admin</div>
  <div class="nav-links">
    <span id="adminName" style="margin-right: 20px; color: #2d2622; font-weight: 600;"></span>
    <a href="index.html">← Volver</a>
    <a href="#" onclick="logoutAdmin()">Salir</a>
  </div>
</nav>

<div id="loginContainer" class="login-form" style="display: none;">
  <h2>🔐 Acceso Admin</h2>
  <div id="loginError" class="error" style="display: none;"></div>
  <div class="form-group">
    <label>Teléfono</label>
    <input type="tel" id="loginPhone" placeholder="64443019">
  </div>
  <div class="form-group">
    <label>Contraseña</label>
    <input type="password" id="loginPassword" placeholder="••••••">
  </div>
  <button class="btn" onclick="adminLogin()">Iniciar Sesión</button>
</div>

<div id="adminPanel" style="display: none;">
  <div class="container">
    <h1>📊 Panel Administrativo</h1>
    
    <div class="tabs" id="adminTabs">
      <button class="tab-btn active" onclick="switchAdminTab('analytics')">📈 Analítica</button>
      <button class="tab-btn" onclick="switchAdminTab('featured')">⭐ Destacados</button>
      <button class="tab-btn" onclick="switchAdminTab('promotions')">🎯 Promociones</button>
    </div>

    <div id="errorMessage" class="error" style="display: none;"></div>
    <div id="successMessage" class="success" style="display: none;"></div>
    
    <!-- ANALYTICS TAB -->
    <div id="analytics" class="card active">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTimePeriod('hour')">Hoy</button>
        <button class="tab-btn" onclick="switchTimePeriod('day')">7 Días</button>
        <button class="tab-btn" onclick="switchTimePeriod('week')">4 Semanas</button>
        <button class="tab-btn" onclick="switchTimePeriod('month')">12 Meses</button>
      </div>

      <div class="dashboard" id="dashboard">
        <div class="loading">Cargando datos...</div>
      </div>
    </div>

    <!-- FEATURED BUSINESSES TAB -->
    <div id="featured" class="card full-width">
      <h3>⭐ Gestionar Destacados</h3>
      
      <div class="form-group">
        <label>Buscar Negocio</label>
        <input type="text" id="businessSearch" placeholder="Escribe nombre del negocio..." onkeyup="searchBusinesses()">
      </div>

      <div id="businessSearchResults" style="margin-bottom: 20px;"></div>

      <h4 style="margin-top: 24px; margin-bottom: 12px; font-weight: 600;">Negocios Destacados</h4>
      <div id="featuredList" style="min-height: 100px;"></div>
    </div>

    <!-- PROMOTIONS TAB -->
    <div id="promotions" class="card full-width">
      <h3>🎯 Gestionar Promociones</h3>
      
      <h4 style="margin-bottom: 12px; font-weight: 600;">Nueva Promoción</h4>
      
      <div class="form-group">
        <label>Título</label>
        <input type="text" id="promTitle" placeholder="Ej: Descuento 20% en Pupusas">
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea id="promDescription" placeholder="Describe la promoción..."></textarea>
      </div>

      <div class="form-group">
        <label>URL de Imagen (Banner)</label>
        <input type="url" id="promImage" placeholder="https://...">
      </div>

      <div class="form-group">
        <label>Tipo</label>
        <select id="promType">
          <option value="banner">Banner Hero</option>
          <option value="discount">Descuento</option>
          <option value="featured">Destacado</option>
        </select>
      </div>

      <div class="form-group">
        <label>Fecha Inicio</label>
        <input type="datetime-local" id="promStart">
      </div>

      <div class="form-group">
        <label>Fecha Fin</label>
        <input type="datetime-local" id="promEnd">
      </div>

      <button class="btn" onclick="createPromotion()">➕ Crear Promoción</button>

      <h4 style="margin-top: 24px; margin-bottom: 12px; font-weight: 600;">Promociones Activas</h4>
      <div id="promotionsList" style="min-height: 100px;"></div>
    </div>
  </div>
</div>

<!-- Modal para ver lista completa -->
<div class="modal" id="listModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeListModal()">✕</button>
    <h2 id="modalTitle">Lista Completa</h2>
    <div id="modalList"></div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
let currentAdmin = null;
let currentTimePeriod = 'hour';
let allBusinesses = [];
let allFeatured = [];
let allPromotions = [];

// ===== ADMIN AUTH =====
async function adminLogin() {
  const phone = document.getElementById('loginPhone').value;
  const password = document.getElementById('loginPassword').value;

  try {
    const { data: users, error } = await supabase
      .from('users')
      .select('*')
      .eq('phone_number', phone)
      .eq('role', 'admin');

    if (error || !users || users.length === 0) {
      showError('Credenciales inválidas');
      return;
    }

    const user = users[0];
    
    // Simple password check (in production, use bcrypt)
    function simpleHash(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash = hash & hash;
      }
      return hash.toString();
    }

    if (simpleHash(password) !== user.password_hash) {
      showError('Credenciales inválidas');
      return;
    }

    currentAdmin = user;
    localStorage.setItem('marsella-admin', JSON.stringify(user));
    showAdminPanel();
  } catch (err) {
    showError('Error: ' + err.message);
  }
}

function logoutAdmin() {
  localStorage.removeItem('marsella-admin');
  location.reload();
}

function showAdminPanel() {
  document.getElementById('loginContainer').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
  document.getElementById('adminName').textContent = '👤 ' + currentAdmin.name;
  loadAllData();
}

// ===== DATA LOADING =====
async function loadAllData() {
  try {
    const { data: businesses } = await supabase.from('businesses').select('*');
    allBusinesses = businesses || [];

    const { data: featured } = await supabase.from('featured_businesses').select('*,businesses(nombre)').order('featured_order');
    allFeatured = featured || [];

    const { data: promos } = await supabase.from('promotions').select('*').eq('is_active', true);
    allPromotions = promos || [];

    await loadAnalytics();
    renderFeaturedList();
    renderPromotionsList();
  } catch (err) {
    console.error('Load error:', err);
  }
}

async function loadAnalytics() {
  try {
    const { data: events } = await supabase
      .from('analytics_events')
      .select('*')
      .gte('created_at', getTimePeriodStart(currentTimePeriod));

    const traffic = calculateTraffic(events);
    const topSearches = getTopSearches(events);
    const topBusinesses = getTopBusinesses(events);

    renderAnalytics(traffic, topSearches, topBusinesses);
  } catch (err) {
    console.error('Analytics error:', err);
  }
}

function getTimePeriodStart(period) {
  const now = new Date();
  switch (period) {
    case 'hour': return new Date(now.getTime() - 24 * 60 * 60 * 1000).toISOString();
    case 'day': return new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000).toISOString();
    case 'week': return new Date(now.getTime() - 28 * 24 * 60 * 60 * 1000).toISOString();
    case 'month': return new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000).toISOString();
  }
}

function calculateTraffic(events) {
  const logins = events.filter(e => e.event_type === 'login').length;
  const searches = events.filter(e => e.event_type === 'search').length;
  const clicks = events.filter(e => e.event_type === 'business_click').length;
  const totalUsers = new Set(events.map(e => e.user_id)).size;
  return { logins, searches, clicks, totalUsers };
}

function getTopSearches(events) {
  const searches = {};
  events.filter(e => e.event_type === 'search' && e.search_query)
    .forEach(e => {
      searches[e.search_query] = (searches[e.search_query] || 0) + 1;
    });
  return Object.entries(searches).sort((a, b) => b[1] - a[1]).slice(0, 10);
}

function getTopBusinesses(events) {
  const clicks = {};
  events.filter(e => e.event_type === 'business_click' && e.business_id)
    .forEach(e => {
      clicks[e.business_id] = (clicks[e.business_id] || 0) + 1;
    });
  return Object.entries(clicks).sort((a, b) => b[1] - a[1]).slice(0, 10);
}

function renderAnalytics(traffic, topSearches, topBusinesses) {
  const dashboard = document.getElementById('dashboard');
  dashboard.innerHTML = `
    <div class="card">
      <h3>📊 Tráfico General</h3>
      <div class="stat-item">
        <span class="stat-label">Total de Usuarios</span>
        <span class="stat-value">${traffic.totalUsers}</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Inicios de Sesión</span>
        <span class="stat-value">${traffic.logins}</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Búsquedas</span>
        <span class="stat-value">${traffic.searches}</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Clics en Negocios</span>
        <span class="stat-value">${traffic.clicks}</span>
      </div>
    </div>

    <div class="card">
      <h3>🔝 Top 10 Búsquedas</h3>
      ${topSearches.slice(0, 5).map((s, i) => `
        <div class="stat-item">
          <span class="stat-label">${i + 1}. ${s[0]}</span>
          <span class="stat-value">${s[1]}</span>
        </div>
      `).join('')}
      <button class="btn-expand" onclick="showAllSearches('${JSON.stringify(topSearches)}')">Ver Todas</button>
    </div>

    <div class="card">
      <h3>🏪 Top Negocios Clicados</h3>
      ${topBusinesses.slice(0, 5).map((b, i) => `
        <div class="stat-item">
          <span class="stat-label">${i + 1}. Negocio #${b[0]}</span>
          <span class="stat-value">${b[1]}</span>
        </div>
      `).join('')}
      <button class="btn-expand" onclick="showAllBusinessClicks('${JSON.stringify(topBusinesses)}')">Ver Todos</button>
    </div>
  `;
}

// ===== FEATURED BUSINESSES =====
function searchBusinesses() {
  const query = document.getElementById('businessSearch').value.toLowerCase();
  const results = allBusinesses.filter(b => b.nombre.toLowerCase().includes(query));
  
  const html = results.map(b => {
    const isFeatured = allFeatured.some(f => f.business_id === b.id);
    return `
      <div class="featured-item">
        <div class="info">${b.nombre} - ${b.categoria}</div>
        <button class="btn-sm ${isFeatured ? 'danger' : ''}" onclick="toggleFeatured(${b.id}, ${!isFeatured})">
          ${isFeatured ? '✕ Quitar' : '⭐ Destacar'}
        </button>
      </div>
    `;
  }).join('');

  document.getElementById('businessSearchResults').innerHTML = html || '<p style="color: #6b6560;">No encontrado</p>';
}

async function toggleFeatured(bizId, add) {
  try {
    if (add) {
      const maxOrder = Math.max(...allFeatured.map(f => f.featured_order || 0), -1);
      await supabase.from('featured_businesses').insert({
        business_id: bizId,
        featured_order: maxOrder + 1,
        created_by: currentAdmin.id
      });
      showSuccess('Negocio destacado');
    } else {
      await supabase.from('featured_businesses').delete().eq('business_id', bizId);
      showSuccess('Negocio removido de destacados');
    }
    await loadAllData();
  } catch (err) {
    showError('Error: ' + err.message);
  }
}

function renderFeaturedList() {
  const html = allFeatured.map((f, i) => `
    <div class="featured-item">
      <div class="info">${i + 1}. ${f.businesses?.nombre || 'Cargando...'}</div>
      <button class="btn-sm danger" onclick="toggleFeatured(${f.business_id}, false)">✕</button>
    </div>
  `).join('');

  document.getElementById('featuredList').innerHTML = html || '<p style="color: #6b6560;">Sin destacados aún</p>';
}

// ===== PROMOTIONS =====
async function createPromotion() {
  const title = document.getElementById('promTitle').value;
  const desc = document.getElementById('promDescription').value;
  const image = document.getElementById('promImage').value;
  const type = document.getElementById('promType').value;
  const start = document.getElementById('promStart').value;
  const end = document.getElementById('promEnd').value;

  if (!title) {
    showError('Completa el título');
    return;
  }

  try {
    await supabase.from('promotions').insert({
      title, description: desc, banner_image_url: image,
      promotion_type: type, start_date: start, end_date: end,
      is_active: true, created_by: currentAdmin.id
    });

    document.getElementById('promTitle').value = '';
    document.getElementById('promDescription').value = '';
    document.getElementById('promImage').value = '';
    document.getElementById('promStart').value = '';
    document.getElementById('promEnd').value = '';

    showSuccess('Promoción creada');
    await loadAllData();
  } catch (err) {
    showError('Error: ' + err.message);
  }
}

async function deletePromotion(id) {
  try {
    await supabase.from('promotions').delete().eq('id', id);
    showSuccess('Promoción eliminada');
    await loadAllData();
  } catch (err) {
    showError('Error: ' + err.message);
  }
}

function renderPromotionsList() {
  const html = allPromotions.map(p => `
    <div class="featured-item">
      <div class="info">
        <strong>${p.title}</strong><br>
        <small style="color: #6b6560;">${p.promotion_type} • ${p.description || ''}</small>
      </div>
      <button class="btn-sm danger" onclick="deletePromotion(${p.id})">✕</button>
    </div>
  `).join('');

  document.getElementById('promotionsList').innerHTML = html || '<p style="color: #6b6560;">Sin promociones</p>';
}

// ===== UI FUNCTIONS =====
window.switchAdminTab = function(tab) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  document.querySelectorAll('#adminTabs .tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
};

window.switchTimePeriod = function(period) {
  currentTimePeriod = period;
  document.querySelectorAll('#analytics .tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  loadAnalytics();
};

window.showAllSearches = function(data) {
  const modal = document.getElementById('listModal');
  const searches = JSON.parse(data);
  document.getElementById('modalTitle').textContent = 'Todas las Búsquedas';
  document.getElementById('modalList').innerHTML = searches.map((s, i) => `
    <div class="list-item">
      <span class="list-rank">#${i + 1}</span>
      <span>${s[0]}</span>
      <span class="stat-value">${s[1]}</span>
    </div>
  `).join('');
  modal.classList.add('active');
};

window.showAllBusinessClicks = function(data) {
  const modal = document.getElementById('listModal');
  const clicks = JSON.parse(data);
  document.getElementById('modalTitle').textContent = 'Todos los Negocios';
  document.getElementById('modalList').innerHTML = clicks.map((c, i) => `
    <div class="list-item">
      <span class="list-rank">#${i + 1}</span>
      <span>Negocio #${c[0]}</span>
      <span class="stat-value">${c[1]}</span>
    </div>
  `).join('');
  modal.classList.add('active');
};

window.closeListModal = function() {
  document.getElementById('listModal').classList.remove('active');
};

window.toggleFeatured = toggleFeatured;
window.deletePromotion = deletePromotion;
window.createPromotion = createPromotion;
window.searchBusinesses = searchBusinesses;
window.adminLogin = adminLogin;
window.logoutAdmin = logoutAdmin;

function showError(msg) {
  const el = document.getElementById('errorMessage');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}

function showSuccess(msg) {
  const el = document.getElementById('successMessage');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}

// Initialize
const admin = localStorage.getItem('marsella-admin');
if (admin) {
  currentAdmin = JSON.parse(admin);
  showAdminPanel();
} else {
  document.getElementById('loginContainer').style.display = 'block';
}
</script>
